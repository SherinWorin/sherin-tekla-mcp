name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-smoke:
    name: Unit tests + MCP smoke test (mock backend, net8.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Unit tests
        run: dotnet test tests/SherinTeklaMcp.Core.Tests -c Release
      - name: Build server (net8.0 mock)
        run: dotnet build src/SherinTeklaMcp.Server/SherinTeklaMcp.Server.csproj -c Release
      - name: MCP smoke test
        run: python3 scripts/smoke_test.py dotnet src/SherinTeklaMcp.Server/bin/Release/net8.0/SherinTeklaMcp.Server.dll

  build-windows-tekla2025:
    name: Build for Tekla Structures 2025 (net48, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build solution
        run: dotnet build SherinTeklaMcp.sln -c Release
      - name: Unit tests
        run: dotnet test tests/SherinTeklaMcp.Core.Tests -c Release --no-build
      - name: MCP smoke test (net48 exe, mock backend)
        run: python scripts/smoke_test.py src/SherinTeklaMcp.Server/bin/Release/net48/SherinTeklaMcp.Server.exe
      - name: Upload server build
        uses: actions/upload-artifact@v4
        with:
          name: sherin-tekla-mcp-tekla2025-net48
          path: src/SherinTeklaMcp.Server/bin/Release/net48/
